<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barras secundarias de área: cafe(activo) y salon(activo). -->

<!-- ========== BARRA DEL CAFÉ (parámetro: ítem activo) ========== -->
<div th:fragment="cafe(activo)" class="pz-areabar">
    <nav class="container-xxl px-4 pz-areabar-nav" th:aria-label="#{areabar.cafe.nombre}">
        <span class="pz-areabar-nombre" th:text="#{areabar.cafe.nombre}">Café</span>
        <a class="pz-areabar-link" th:href="@{/cafe}" th:classappend="${activo == 'resumen'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'resumen'} ? 'page'" th:text="#{areabar.cafe.resumen}">Resumen</a>
        <a class="pz-areabar-link" th:href="@{/cafe/menu}" th:classappend="${activo == 'menu'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'menu'} ? 'page'" th:text="#{areabar.cafe.menu}">Menú</a>
        <a class="pz-areabar-link" th:href="@{/cafe/reservar}" th:classappend="${activo == 'reservar'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'reservar'} ? 'page'" th:text="#{areabar.cafe.reservar}">Reservar mesa</a>
    </nav>
</div>

<!-- ========== BARRA DEL SALÓN (parámetro: ítem activo) ========== -->
<div th:fragment="salon(activo)" class="pz-areabar">
    <nav class="container-xxl px-4 pz-areabar-nav" th:aria-label="#{areabar.salon.nombre}">
        <span class="pz-areabar-nombre" th:text="#{areabar.salon.nombre}">Salón</span>
        <a class="pz-areabar-link" th:href="@{/salon}" th:classappend="${activo == 'resumen'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'resumen'} ? 'page'" th:text="#{areabar.salon.resumen}">Resumen</a>
        <a class="pz-areabar-link" th:href="@{/salon#servicios}" th:classappend="${activo == 'servicios'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'servicios'} ? 'page'" th:text="#{areabar.salon.servicios}">Servicios</a>
        <!-- Agendar cita: se habilita en la rama del flujo de agendamiento -->
        <a class="pz-areabar-link pz-areabar-disabled" aria-disabled="true" th:text="#{areabar.salon.agendar}">Agendar cita</a>
    </nav>
</div>

</body>
</html>
