<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra secundaria de área. La versión del Salón (salon(activo)) se agregará en este mismo archivo en la rama de la página del Salón. -->

<!-- ========== BARRA DEL CAFÉ (parámetro: ítem activo) ========== -->
<div th:fragment="cafe(activo)" class="pz-areabar">
    <nav class="container-xxl px-4 pz-areabar-nav" th:aria-label="#{areabar.cafe.nombre}">
        <span class="pz-areabar-nombre" th:text="#{areabar.cafe.nombre}">Café</span>
        <a class="pz-areabar-link" th:href="@{/cafe}" th:classappend="${activo == 'resumen'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'resumen'} ? 'page'" th:text="#{areabar.cafe.resumen}">Resumen</a>
        <a class="pz-areabar-link" th:href="@{/cafe/menu}" th:classappend="${activo == 'menu'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'menu'} ? 'page'" th:text="#{areabar.cafe.menu}">Menú</a>
        <a class="pz-areabar-link" th:href="@{/cafe/reservar}" th:classappend="${activo == 'reservar'} ? 'pz-areabar-active'"
           th:attr="aria-current=${activo == 'reservar'} ? 'page'" th:text="#{areabar.cafe.reservar}">Reservar mesa</a>
    </nav>
</div>

</body>
</html>
