<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ========== HEAD ========== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Private Zone Wellness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- ========== HEADER + NAVBAR ========== -->
<header th:fragment="header">
    <nav class="navbar sticky-top pz-navbar">
        <div class="container-xxl px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-flower1 pz-logo"></i>
                <span class="d-flex flex-column lh-1">
                    <span class="pz-brand" th:text="#{brand.name}">Private zone</span>
                    <span class="pz-brand-sub" th:text="#{brand.sub}">WELLNESS</span>
                </span>
            </a>
            <div class="d-flex gap-2">
                <a class="btn pz-pill" href="#cafe" th:text="#{nav.cafe}">Café</a>
                <a class="btn pz-pill" href="#salon" th:text="#{nav.salon}">Salón</a>
            </div>
        </div>
    </nav>
</header>

<!-- ========== FOOTER ========== -->
<footer th:fragment="footer" class="pz-footer">
    <div class="container-xxl px-4 pt-5 pb-4">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-flower1 pz-logo text-white"></i>
                    <span class="d-flex flex-column lh-1">
                        <span class="pz-brand text-white" th:text="#{brand.name}">Private zone</span>
                        <span class="pz-brand-sub" th:text="#{brand.sub}">WELLNESS</span>
                    </span>
                </div>
                <p class="small pz-footer-text" th:text="#{footer.descripcion}"></p>
            </div>
            <div class="col-lg-3">
                <h6 class="pz-footer-title" th:text="#{footer.ubicacion}">UBICACIÓN</h6>
                <a href="https://www.google.com/maps/search/?api=1&amp;query=Heredia+Costa+Rica" target="_blank" rel="noopener"
                   class="pz-map d-flex flex-column align-items-center justify-content-center text-decoration-none mb-2">
                    <i class="bi bi-geo-alt fs-5"></i>
                    <small th:text="#{footer.mapa}">Ver en Google Maps</small>
                </a>
                <p class="small pz-footer-text mb-0"><i class="bi bi-geo-alt me-2 pz-gold"></i><span th:text="#{footer.direccion}"></span></p>
            </div>
            <div class="col-lg-3">
                <h6 class="pz-footer-title" th:text="#{footer.contacto}">CONTACTO Y HORARIO</h6>
                <ul class="list-unstyled small pz-footer-text mb-0">
                    <li class="mb-2"><i class="bi bi-telephone me-2 pz-gold"></i><a href="tel:+50600000000" th:text="#{footer.telefono}"></a></li>
                    <li class="mb-2"><i class="bi bi-whatsapp me-2 pz-gold"></i><a href="https://wa.me/50600000000" target="_blank" rel="noopener" th:text="#{footer.whatsapp}"></a></li>
                    <li class="mb-2"><i class="bi bi-envelope me-2 pz-gold"></i><a href="mailto:hola@privatezone.cr" th:text="#{footer.correo}"></a></li>
                    <li class="mb-2"><i class="bi bi-clock me-2 pz-gold"></i><span th:text="#{footer.horario1}"></span></li>
                    <li><i class="bi bi-clock me-2 pz-gold"></i><span th:text="#{footer.horario2}"></span></li>
                </ul>
            </div>
            <div class="col-lg-3">
                <h6 class="pz-footer-title" th:text="#{footer.redes}">REDES</h6>
                <div class="d-flex gap-2 mb-3">
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener" class="pz-social" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="https://www.facebook.com/" target="_blank" rel="noopener" class="pz-social" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                    <a href="https://www.tiktok.com/" target="_blank" rel="noopener" class="pz-social" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
                </div>
                <ul class="list-unstyled small pz-footer-text mb-0">
                    <li class="mb-1"><a href="#" th:text="#{footer.privacidad}"></a></li>
                    <li><a href="#" th:text="#{footer.terminos}"></a></li>
                </ul>
            </div>
        </div>
        <hr class="pz-footer-hr my-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 small pz-footer-text">
            <span th:text="#{footer.copy}"></span>
            <span class="pz-gold" th:text="#{footer.lema}"></span>
            <a href="#" class="btn btn-sm pz-pill-outline"><i class="bi bi-lock me-1"></i><span th:text="#{footer.colaboradores}"></span></a>
        </div>
    </div>
</footer>

<!-- ========== SCRIPTS ========== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
