<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Private Zone · Café')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container-xxl px-4 py-5">
    <ul class="nav nav-pills mb-4" role="tablist">
        <li class="nav-item" th:each="c, st : ${categorias}">
            <button class="nav-link" type="button" data-bs-toggle="pill"
                    th:classappend="${st.first} ? 'active'"
                    th:attr="data-bs-target=${'#cat-' + c.id}"
                    th:text="${c.nombre}">Categoría</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade" th:each="c, st : ${categorias}"
             th:id="${'cat-' + c.id}"
             th:classappend="${st.first} ? 'show active'">
            <div class="row g-3">
                <div class="col-md-4" th:each="p : ${productos}"
                     th:if="${p.categoria.id == c.id}">
                    <div class="pz-cat h-100">
                        <h3 class="pz-h3" th:text="${p.nombre}">Producto</h3>
                        <p class="pz-cat-desc" th:text="${p.descripcion}">Descripción</p>
                        <p class="fw-semibold">₡<span
                                th:text="${#numbers.formatInteger(p.precio, 1, 'POINT')}">0</span></p>

                        <span class="badge text-bg-light"
                              th:if="${#lists.isEmpty(p.alergenos)}"
                              th:text="#{cafepag.sinAlergenos}">Sin alérgenos</span>

                        <span class="badge text-bg-light" th:each="a : ${p.alergenos}"
                              th:text="#{cafepag.contiene} + ' ' + ${a.nombre}">Contiene</span>

                        <small class="d-block mt-2" th:if="${!p.disponible}"
                               th:text="#{cafepag.agotado}">No disponible hoy</small>

                        <small class="d-block mt-2"
                               th:if="${p.disponible and p.paraLlevar}"
                               th:text="#{cafepag.llevar}">Disponible para llevar</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
