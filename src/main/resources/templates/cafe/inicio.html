<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Private Zone · Café')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container-xxl px-4 py-5">
    <div class="pz-card p-4 p-lg-5">
        <p class="pz-eyebrow mb-2" th:text="#{cafepag.eyebrow}">CAFETERÍA</p>
        <h1 class="pz-h2" th:text="#{cafepag.titulo}">Título</h1>
        <p class="pz-text" th:text="#{cafepag.desc}">Descripción</p>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a class="btn pz-btn-dark" th:href="@{/cafe/menu}" th:text="#{cafepag.verMenu}">Ver menú</a>
            <a class="btn pz-pill" th:href="@{/cafe/reservar}" th:text="#{cafepag.reservar}">Reservar mesa</a>
        </div>

        <div class="row g-3">
                <div th:each="c : ${categorias}" class="col-md-4">
                    <div class="pz-cat h-100">
                        <span class="pz-cat-icon"><i class="bi" th:classappend="${c.icono}"></i></span>
                        <h3 class="pz-h3" th:text="${c.nombre}">Categoría</h3>
                        <p class="pz-cat-desc" th:text="${c.descripcion}">Descripción</p>
                        <small class="pz-cat-precio"><span th:text="#{comun.desde}">Desde</span> ₡<span th:text="${#numbers.formatInteger(c.precioDesde,1,'POINT')}">0</span></small>
                    </div>
                </div>
            </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
